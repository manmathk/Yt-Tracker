<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YouTube Tracker Setup</title><link rel="stylesheet" href="live.css"></head><body class="config-page"><main class="config-card"><div class="eyebrow"><span class="live-dot"></span> SETUP</div><h1>YouTube API Key</h1><p>Enter your own YouTube Data API v3 key. It is stored only in this browser's localStorage and is never committed to GitHub.</p><input id="key" type="password" autocomplete="off" placeholder="AIza..."><div class="actions"><button id="save">Save Key</button><button id="clear" class="secondary">Clear</button></div><p id="msg"></p><a href="live.html">Open Live Tracker →</a></main><script>const k=document.getElementById('key'),m=document.getElementById('msg');k.value=localStorage.getItem('yt_tracker_api_key')||'';document.getElementById('save').onclick=()=>{if(!k.value.trim()){m.textContent='Enter an API key.';return}localStorage.setItem('yt_tracker_api_key',k.value.trim());m.textContent='Saved locally in this browser.'};document.getElementById('clear').onclick=()=>{localStorage.removeItem('yt_tracker_api_key');k.value='';m.textContent='Key cleared.'}</script></body></html>
